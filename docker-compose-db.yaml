services:
  pg:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - 5432:$POSTGRES_PORT

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080